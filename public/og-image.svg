<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="page-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F4FF"/>
      <stop offset="100%" stop-color="#EDE9FF"/>
    </linearGradient>
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F7CFF"/>
      <stop offset="100%" stop-color="#8A5CF6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#page-grad)"/>
  <!-- Subtle grid pattern -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#C7D2FE" stroke-width="1" opacity="0.4"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#C7D2FE" stroke-width="1" opacity="0.4"/>
  <!-- Icon: centered, 160x160 -->
  <rect x="420" y="175" width="160" height="160" rx="35" ry="35" fill="url(#icon-grad)"/>
  <!-- Bars proportional inside 160x160 icon -->
  <rect x="455" y="265" width="22" height="46" rx="6" ry="6" fill="white"/>
  <rect x="489" y="243" width="22" height="68" rx="6" ry="6" fill="white"/>
  <rect x="523" y="222" width="22" height="89" rx="6" ry="6" fill="white"/>
  <!-- Wordmark -->
  <text x="600" y="395" font-family="'Inter','Segoe UI',Arial,sans-serif" font-weight="500" font-size="60" fill="#1A1A2E" text-anchor="middle" letter-spacing="-1">Analyst<tspan fill="#6A5CF6">.Ai</tspan></text>
  <!-- Tagline -->
  <text x="600" y="450" font-family="'Inter','Segoe UI',Arial,sans-serif" font-weight="400" font-size="24" fill="#475569" text-anchor="middle">AI-Powered Data Analytics Platform</text>
  <!-- URL -->
  <text x="600" y="580" font-family="'Inter','Segoe UI',Arial,sans-serif" font-weight="400" font-size="18" fill="#8A5CF6" text-anchor="middle">data-lens-ai-omega.vercel.app</text>
</svg>
